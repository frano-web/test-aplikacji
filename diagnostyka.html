<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLANER — diagnostyka</title><link rel="stylesheet" href="./styles.css?v=22"></head><body><main class="auth-shell"><section class="auth-card"><div class="brand"><div class="brand-mark">P</div><div><h1>PLANER</h1><p>Diagnostyka uruchomienia</p></div></div><div id="checks" class="feature-list" style="margin-top:18px"></div><div class="actions" style="margin-top:16px"><a class="primary" href="./">Wróć do PLANER</a><button id="retry" class="ghost" type="button">Sprawdź ponownie</button></div></section></main><script src="./config.js?v=22"></script><script>
const box=document.getElementById('checks');
function row(name,status,detail=''){box.insertAdjacentHTML('beforeend',`<div class="feature"><strong>${status?'✅':'❌'} ${name}</strong><div class="muted">${detail}</div></div>`)}
async function run(){box.innerHTML='';const c=window.PLANER_CONFIG||{};row('config.js',Boolean(c.SUPABASE_URL&&c.SUPABASE_PUBLISHABLE_KEY),c.SUPABASE_URL||'Brak adresu projektu');let lib=false;for(const url of ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2.115.0/dist/umd/supabase.js']){try{await new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=rej;document.head.appendChild(s)});lib=Boolean(window.supabase?.createClient);if(lib){row('Supabase JS',true,'Biblioteka załadowana.');break}}catch(_e){}}if(!lib){row('Supabase JS',false,'Nie udało się pobrać biblioteki z jsDelivr ani unpkg.');return}try{const client=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);const result=await Promise.race([client.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),6000))]);row('Połączenie Auth',true,result.data.session?'Sesja użytkownika istnieje.':'Supabase odpowiada. Brak aktywnej sesji — to normalne przed logowaniem.')}catch(e){row('Połączenie Auth',false,e?.message||String(e))}}
document.getElementById('retry').onclick=run;run();
</script></body></html>
